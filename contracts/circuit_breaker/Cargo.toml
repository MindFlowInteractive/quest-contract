[package]
name = "circuit-breaker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# `lib` lets other Soroban contracts depend on this module and reuse the pause
# guard helper, while `cdylib` produces the deployable contract wasm.
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = "21.7.7"

[dev-dependencies]
soroban-sdk = { version = "21.7.7", features = ["testutils"] }
