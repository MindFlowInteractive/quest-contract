[package]
name = "puzzle-verification"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

# Note: commit-reveal support for puzzle submissions is implemented in
# contracts/commit_reveal; this crate only tracks the testutils feature.
